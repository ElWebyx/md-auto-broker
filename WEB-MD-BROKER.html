<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MD Auto Broker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Concepto: corredor de confianza. Cabecera blanca con el logo, portada azul marino con las flechas circulares del logo como motivo, stock limpio sobre blanco, el naranja reservado a la llamada. Colores sacados del logo: marino, azul, verde y naranja. */
:root{
  --bg:#ffffff; --surface:#f0f4f8; --ink:#0f3250; --muted:#51647a; --line:#dce4ec;
  --navy:#0f3250; --navy2:#16426a; --blue:#1d6a9c; --green:#4fa33f; --orange:#f08a2c; --on-orange:#0f3250;
  --hdr:#ffffff; --hdr-line:#e3e9ef;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09192c; --surface:#0f2640; --ink:#eaf1f8; --muted:#92a6bc; --line:#1d3a5a; --hdr:#0f3250; --hdr-line:#1d3a5a; --blue:#58a6dd; --green:#63c455; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09192c; --surface:#0f2640; --ink:#eaf1f8; --muted:#92a6bc; --line:#1d3a5a; --hdr:#0f3250; --hdr-line:#1d3a5a; --blue:#58a6dd; --green:#63c455; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);padding-left:var(--gl);padding-right:var(--gr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--hdr)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.band{margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);border-bottom:1px solid var(--hdr-line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0}
.plate{background:#fff;border-radius:8px;padding:4px 10px;display:inline-flex}
.brand img{height:52px;width:auto;max-width:100%;display:block}
.wm{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);padding:6px 4px}
nav.links{display:flex;gap:26px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
nav.links a{text-decoration:none;color:var(--muted)} nav.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--orange);color:var(--on-orange);padding:14px 26px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:6px;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.line{background:transparent;color:inherit;border:2px solid currentColor;padding:12px 24px}
.btn.sm{padding:8px 14px;font-size:15px;letter-spacing:.06em}
.btn.sm.line{padding:6px 12px}
.btn.danger{background:transparent;color:#d23a2a;border:2px solid #d23a2a;padding:6px 12px}
.btn.call{padding:11px 20px;font-size:20px}
.btn svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
/* portada */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.hero .deco{position:absolute;right:-8%;top:50%;width:min(780px,92vw);transform:translateY(-50%);z-index:-1;opacity:.5;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-block:72px 80px}
.kicker{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--orange)}
.kicker::before{content:"";width:34px;height:3px;background:currentColor}
.hero h1{font-size:clamp(52px,8.6vw,112px);margin:18px 0 0;font-weight:800;line-height:.9}
.hero h1 em{font-style:normal;color:var(--orange);display:block}
.hero p.lead{max-width:48ch;color:#cbd8e6;font-size:18px;margin:26px 0 32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .in{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.hero .in.d2{animation-delay:.12s}.hero .in.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.feat{background:#fff;color:var(--navy);border:0;cursor:pointer;display:block;text-align:left;width:100%;padding:0;position:relative;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.feat .ph{aspect-ratio:16/11}
.feat .meta{padding:20px 22px 22px;display:grid;gap:8px}
.feat .lab{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);font-weight:800}
.feat h3{font-size:34px}
.feat .row2{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.feat .specs{color:#51647a}
/* fotos */
.ph{aspect-ratio:4/3;background:var(--surface);position:relative;overflow:hidden;display:grid;place-items:center;color:#a9b8c8}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.ph svg{width:62%;height:auto;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ph .cap{position:absolute;bottom:10px;left:14px;font-family:var(--f-display);font-weight:700;letter-spacing:.2em;font-size:13px;text-transform:uppercase}
.tag{position:absolute;top:12px;left:12px;background:var(--navy);color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;padding:4px 12px;border-radius:4px}
.tag.res{background:var(--orange);color:var(--on-orange)} .tag.ok{background:var(--green);color:#fff}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.price{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
/* cinta */
.marq{background:var(--blue);color:#fff;overflow:hidden;white-space:nowrap}
.marq div{display:inline-flex;animation:slide 40s linear infinite;padding-block:13px}
.marq span{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2em;text-transform:uppercase;padding-inline:26px}
.marq span::after{content:"•";margin-left:52px;color:var(--orange)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq div,.hero .in{animation:none}}
/* secciones */
section{padding-block:80px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.sh h2{font-size:clamp(40px,6vw,70px)}
.sh h2 b{color:var(--blue);font-weight:inherit}
.sub{color:var(--muted);max-width:54ch;margin:12px 0 0}
.filters{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-block:1px solid var(--line);margin-bottom:28px;padding-block:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:7px 15px;font-size:13px;font-weight:700;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.spacer{flex:1 1 20px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0;max-width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:26px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0;transition:box-shadow .25s,transform .25s}
.card:hover,.card:focus-visible{box-shadow:0 18px 36px -18px rgba(15,50,80,.45);transform:translateY(-3px)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.card:hover::after,.card:focus-visible::after{transform:scaleX(1)}
.card .body{padding:18px 20px 22px;display:grid;gap:12px}
.card .ref{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);font-weight:800}
.card h3{font-size:27px;line-height:1}
.card .foot{display:flex;justify-content:space-between;align-items:end;gap:10px}
.card .more{font-size:13px;font-weight:700;color:var(--blue)}
.sold .ph img{filter:grayscale(1);opacity:.5} .sold .price{color:var(--muted);text-decoration:line-through}
.empty{border:2px dashed var(--line);border-radius:10px;padding:56px 20px;text-align:center;color:var(--muted)}
/* proceso */
.proc{background:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;position:relative;counter-reset:s}
.steps::before{content:"";position:absolute;left:24px;right:24px;top:27px;height:3px;background:linear-gradient(90deg,var(--blue),var(--green),var(--orange));opacity:.5}
.step{position:relative}
.step .n{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--f-display);font-weight:800;font-size:30px;display:grid;place-items:center;border:4px solid var(--surface);position:relative;margin-bottom:18px}
.step:nth-child(1) .n{background:var(--blue)}.step:nth-child(2) .n{background:var(--green)}.step:nth-child(3) .n{background:var(--orange);color:var(--on-orange)}.step:nth-child(4) .n{background:var(--navy)}
.step h3{font-size:28px;margin-bottom:8px}
.step p{margin:0;color:var(--muted)}
/* contacto */
.contact{background:var(--navy);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.contact .deco{position:absolute;left:-12%;top:50%;width:min(700px,90vw);transform:translateY(-50%);z-index:-1;opacity:.3;pointer-events:none}
.contact .wrap{padding-block:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.contact h2{font-size:clamp(42px,6.6vw,86px)} .contact h2 b{color:var(--orange);font-weight:inherit}
.contact p{color:#cbd8e6;max-width:46ch}
.callbox{background:#fff;color:var(--navy);border-radius:12px;padding:32px;display:grid;gap:14px;box-shadow:0 30px 60px -24px rgba(0,0,0,.6)}
.callbox .lab{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--blue);font-weight:800}
.phone{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,8vw,78px);line-height:1;letter-spacing:.02em;user-select:all;color:var(--navy)}
.callbox .acts{justify-content:flex-start}
.callbox .btn.line{color:var(--navy)}
footer{background:#0a2540;color:#9fb3c8;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:28px}
footer .plate{padding:3px 8px} footer .plate img{height:40px;width:auto;display:block}
/* ficha */
dialog{border:0;background:var(--bg);color:var(--ink);padding:0;border-radius:12px;width:min(1000px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto}
dialog::backdrop{background:rgba(5,15,28,.72)}
.dlg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.gal{background:#0a2540;position:relative;align-self:start}
.gal .ph{aspect-ratio:4/3;background:#10304f;color:#4b6c8c;border-radius:0}
.nav{position:absolute;top:calc(50% - 40px);width:42px;height:56px;border:0;background:rgba(10,37,64,.75);color:#fff;font-size:24px} .nav.p{left:0;border-radius:0 6px 6px 0}.nav.n{right:0;border-radius:6px 0 0 6px}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;background:none;flex:0 0 auto;border-radius:4px;overflow:hidden} .thumbs button[aria-current="true"]{border-color:var(--orange)}
.thumbs img{width:68px;height:50px;object-fit:cover;display:block}
.info{padding:34px 32px;display:grid;gap:18px;align-content:start;min-width:0}
.info h2{font-size:42px}
.sl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;margin:0;border-block:1px solid var(--line);padding-block:18px}
.sl dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700} .sl dd{margin:0;font-weight:700;font-size:17px}
.eq{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none} .eq li{background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.eqh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin:0 0 8px}
.ask{background:var(--navy);color:#fff;border-radius:10px;padding:20px;display:grid;gap:10px}
.ask p{margin:0;color:#cbd8e6;font-size:14px} .ask b{color:#fff}
.ask .num{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;user-select:all}
.x{position:absolute;top:10px;right:10px;z-index:5;background:var(--bg);color:var(--ink);border:0;width:38px;height:38px;border-radius:50%;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
/* gestión */
.admin-bar{position:fixed;right:var(--gr);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.admin-bar .btn{box-shadow:0 8px 24px rgba(0,0,0,.35)} .admin-bar .btn.line{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.admin{padding:26px;display:grid;gap:18px}
.admin h2{font-size:34px}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{width:60px;height:45px;background:var(--surface);overflow:hidden;border-radius:4px} .row .t img{width:100%;height:100%;object-fit:cover}
.row .n{min-width:0} .row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .row .n small{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:grid;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700} .form .full{grid-column:1/-1}
.form .ck{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative} .photos img{width:90px;height:68px;object-fit:cover;display:block;border-radius:4px}
.photos button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);line-height:1;padding:0}
.note{font-size:13px;color:var(--muted)} .dirty{color:#d23a2a;font-weight:700}
@media (max-width:900px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 24px} .steps::before{display:none}
}
@media (max-width:820px){
  .hero .wrap,.contact .wrap,.dlg{grid-template-columns:1fr}
  .hero .wrap{padding-block:44px 52px} .contact .wrap{padding-block:56px}
  nav.links a.opt{display:none} .form{grid-template-columns:1fr} section{padding-block:56px}
  .row{grid-template-columns:48px minmax(0,1fr)} .row .acts{grid-column:1/-1;justify-content:flex-start}
  .filters{position:static} .info{padding:24px 20px} .brand img{height:44px}
}
@media (max-width:520px){.steps{grid-template-columns:1fr} .top .wrap{justify-content:center}}
</style>

const logoImg=cls=>state.logo?`<img src="${state.logo}" alt="MD Auto Broker">`:`<span class="wm">MD Auto Broker</span>`;
function featured(){const v=state.cars.filter(c=>c.estado!=='vendido');return v.find(c=>c.destacado)||v[v.length-1]||null}
function tagOf(c){return c.estado==='vendido'?'<span class="tag">Vendido</span>':c.estado==='reservado'?'<span class="tag res">Reservado</span>':'<span class="tag ok">Disponible</span>'}
function cardHTML(c){
  return `<button class="card ${c.estado==='vendido'?'sold':''}" data-id="${c.id}" aria-label="${esc(tit(c))}">
  <div class="ph">${pic(c)}${tagOf(c)}</div>
  <div class="body">${c.ref?`<div class="ref">${esc(c.ref)}</div>`:''}<h3>${esc(tit(c))}</h3>
  <div class="specs"><span>${c.anio}</span><span>${kmf(c.km)}</span><span>${esc(c.combustible)}</span><span>${esc(c.cambio)}</span>${c.cv?`<span>${c.cv} CV</span>`:''}</div>
  <div class="foot"><div class="price">${eur(c.precio)}</div><span class="more">Ver detalles →</span></div></div></button>`;
}
function filtrar(estados){
  let l=state.cars.filter(c=>estados.includes(c.estado));
  const q=F.q.trim().toLowerCase();
  if(q)l=l.filter(c=>(tit(c)+' '+c.combustible+' '+c.anio+' '+(c.ref||'')+' '+(c.color||'')).toLowerCase().includes(q));
  if(F.comb!=='Todos')l=l.filter(c=>c.combustible===F.comb);
  if(F.cambio!=='Todos')l=l.filter(c=>c.cambio===F.cambio);
  const o=F.orden;
  if(o==='precio-asc')l.sort((a,b)=>a.precio-b.precio);else if(o==='precio-desc')l.sort((a,b)=>b.precio-a.precio);
  else if(o==='km')l.sort((a,b)=>a.km-b.km);else if(o==='anio')l.sort((a,b)=>b.anio-a.anio);else l.reverse();
  return l;
}
function marquee(){
  const m=[...new Set(state.cars.filter(c=>c.estado!=='vendido').map(c=>c.marca).filter(Boolean))];
  let a=m.length?m:['Stock actualizado','Llámanos'];while(a.length<10)a=a.concat(a);
  return a.map(x=>`<span>${esc(x)}</span>`).join('');
}
function gridHTML(){
  const venta=filtrar(['venta','reservado']),vend=filtrar(['vendido']);

  <div class="marq" aria-hidden="true"><div>${marquee()}${marquee()}</div></div>
  <section id="stock" class="wrap">
    <div class="sh"><div><h2>Stock <b>disponible</b></h2><p class="sub">Pulsa un coche para ver todos sus datos y fotos. Si te interesa, llámanos al <b style="color:var(--ink)">${INFO.tel}</b> y dinos la referencia.</p></div></div>
    <div class="filters">
      <div class="chips" role="group" aria-label="Combustible">${combs.map(c=>`<button class="chip" data-comb="${esc(c)}" aria-pressed="${F.comb===c}">${esc(c)}</button>`).join('')}</div>
      <span class="spacer"></span>
      <input id="q" type="search" placeholder="Buscar marca, modelo o referencia" value="${esc(F.q)}" aria-label="Buscar">
      <select id="cambio" aria-label="Cambio">${['Todos','Manual','Automático'].map(v=>`<option value="${v}" ${F.cambio===v?'selected':''}>${v==='Todos'?'Todos los cambios':v}</option>`).join('')}</select>
      <select id="orden" aria-label="Ordenar">${[['recientes','Más recientes'],['precio-asc','Precio: menor a mayor'],['precio-desc','Precio: mayor a menor'],['km','Menos kilómetros'],['anio','Más nuevos']].map(([v,t])=>`<option value="${v}" ${F.orden===v?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div id="gridbox">${gridHTML()}</div>
  </section>
  <div class="proc band" id="como"><div class="wrap" style="padding-block:80px">
    <div class="sh"><div><h2>Cómo <b>funciona</b></h2><p class="sub">Nuestro servicio es traerte el coche que buscas. Tú eliges y nosotros nos encargamos del trámite.</p></div></div>
    <div class="steps">
      <div class="step"><div class="n">1</div><h3>Elige tu coche</h3><p>Mira el stock con todos los datos y fotos de cada vehículo.</p></div>
      <div class="step"><div class="n">2</div><h3>Llámanos</h3><p>Te atendemos, resolvemos tus dudas y te explicamos dónde estamos y cómo será todo el trámite.</p></div>
      <div class="step"><div class="n">3</div><h3>Todo pagado</h3><p>Una vez que esté todo pagado, nos encargamos de que el coche llegue a tus manos.</p></div>
      <div class="step"><div class="n">4</div><h3>Lo recibes</h3><p>El coche llega a tus manos y tú ya solo tienes que disfrutarlo.</p></div>
    </div>
  </div></div>
  <div class="contact band" id="contacto">${ARCS}<div class="wrap">
    <div><div class="kicker">Contacto</div><h2 style="margin-top:14px">¿Has visto un coche <b>que te interesa?</b></h2>
      <p style="margin-top:20px">Llámanos. Te explicamos cómo trabajamos, dónde estamos y cómo hacemos todo el trámite.</p></div>
    <div class="callbox"><div class="lab">Llámanos</div><div class="phone">${INFO.tel}</div>
      <div class="acts"><a class="btn" href="${telHref}">${PHONE_ICON}Llamar ahora</a><button class="btn line copy" data-copy="${INFO.tel}">Copiar número</button></div></div>
  </div></div>
  <footer class="band"><div class="wrap"><span class="plate">${logoImg()}</span><span>© 2026 MD Auto Broker</span></div></footer>`;
}
function renderSite(){$('#site').innerHTML=siteHTML();bindSite()}
function drawGrid(){$('#gridbox').innerHTML=gridHTML();bindGrid()}
function bindGrid(){
  document.querySelectorAll('#gridbox .card').forEach(el=>el.onclick=()=>detalle(el.dataset.id));
  const tv=$('#tv');if(tv)tv.onclick=()=>{F.vendidos=!F.vendidos;drawGrid()};
}
function bindSite(){
  $('#q').oninput=e=>{F.q=e.target.value;drawGrid()};
  $('#orden').onchange=e=>{F.orden=e.target.value;drawGrid()};
  $('#cambio').onchange=e=>{F.cambio=e.target.value;drawGrid()};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F.comb=b.dataset.comb;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.comb===F.comb)));drawGrid()});
  document.querySelectorAll('.feat').forEach(el=>el.onclick=()=>detalle(el.dataset.id));
  bindGrid();bindCopy(document);
}
function bindCopy(root){root.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=b.textContent;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copiado'}catch(e){b.textContent='Selecciónalo y cópialo'}setTimeout(()=>b.textContent=t,1800)})}
function detalle(id){
  const c=state.cars.find(x=>x.id===id);if(!c)return;
  const d=$('#dlg');let i=0;const n=(c.fotos||[]).length;
  const datos=[['Año',c.anio],['Kilómetros',kmf(c.km)],['Combustible',c.combustible],['Cambio',c.cambio],['Potencia',c.cv?c.cv+' CV':''],['Color',c.color],['Carrocería',c.carroceria],['Puertas',c.puertas],['Plazas',c.plazas],['Etiqueta DGT',c.etiqueta]].filter(x=>x[1]!==''&&x[1]!=null&&x[1]!==0);
  const eq=(c.equipamiento||'').split(',').map(x=>x.trim()).filter(Boolean);
  const draw=()=>{d.innerHTML=`<button class="x" aria-label="Cerrar" id="cx">✕</button><div class="dlg">
   <div class="gal"><div class="ph">${pic(c,i)}${tagOf(c)}</div>${n>1?`<button class="nav p" aria-label="Anterior">‹</button><button class="nav n" aria-label="Siguiente">›</button><div class="thumbs">${c.fotos.map((f,k)=>`<button data-k="${k}" aria-current="${k===i}" aria-label="Foto ${k+1}"><img src="${f}" alt=""></button>`).join('')}</div>`:''}</div>
   <div class="info"><div class="kicker">${c.ref?'Ref. '+esc(c.ref):'Ficha'}</div><h2>${esc(tit(c))}</h2>
   <div class="price">${eur(c.precio)}</div>
   <dl class="sl">${datos.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
   ${eq.length?`<div><p class="eqh">Equipamiento</p><ul class="eq">${eq.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
   ${c.desc?`<p style="margin:0;color:var(--muted)">${esc(c.desc)}</p>`:''}
   <div class="ask">${c.estado==='vendido'?`<p><b>Este coche ya está vendido.</b> Llámanos y buscamos uno parecido para ti.</p>`:`<p>¿Te interesa? Llámanos${c.ref?' y dinos la referencia <b>'+esc(c.ref)+'</b>':''}. Te explicamos cómo será el trámite.</p>`}
    <div class="num">${INFO.tel}</div><div class="acts" style="justify-content:flex-start"><a class="btn sm" href="${telHref}">${PHONE_ICON}Llamar</a><button class="btn sm line copy" data-copy="${INFO.tel}">Copiar número</button></div></div></div></div>`;
   $('#cx',d).onclick=()=>d.close();
   d.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;draw()});
   const pv=$('.nav.p',d),nx=$('.nav.n',d);if(pv){pv.onclick=()=>{i=(i-1+n)%n;draw()};nx.onclick=()=>{i=(i+1)%n;draw()}}
   bindCopy(d);
  };
  draw();d.showModal();
}
/* ---- gestión ---- */
function nextRef(){const m=Math.max(0,...state.cars.map(c=>parseInt(String(c.ref||'').replace(/\D/g,''))||0));return 'MD-'+String(m+1).padStart(3,'0')}
function panel(){
  const a=$('#adm');
  if(editing){formulario(a)}
  else{
    a.innerHTML=`<div class="admin"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Gestionar coches</h2><div class="acts"><button class="btn sm" id="nuevo">Añadir coche</button><button class="btn sm line" id="logo">Cambiar logo</button><button class="btn sm line" id="cerrar">Cerrar</button></div></div>
    <p class="note">Los cambios se ven aquí al momento. Para que los vea todo el mundo, pulsa <b>Publicar cambios</b>. ${dirty?'<span class="dirty">Tienes cambios sin publicar.</span>':''}</p>
    <input type="file" id="logof" accept="image/*" hidden>
    <div>${state.cars.length?state.cars.slice().reverse().map(c=>`<div class="row"><div class="t">${c.fotos&&c.fotos[0]?`<img src="${c.fotos[0]}" alt="">`:''}</div>
      <div class="n"><b>${esc(c.ref||'')} ${esc(tit(c))}</b><small>${eur(c.precio)} · ${c.estado==='venta'?'Disponible':c.estado==='vendido'?'Vendido':'Reservado'}${c.destacado?' · Destacado':''}</small></div>
      <div class="acts">
        ${c.estado==='vendido'?`<button class="btn sm line" data-a="venta" data-id="${c.id}">Volver a venta</button>`:`<button class="btn sm" data-a="vendido" data-id="${c.id}">Marcar vendido</button>${c.estado==='venta'?`<button class="btn sm line" data-a="reservado" data-id="${c.id}">Reservar</button>`:`<button class="btn sm line" data-a="venta" data-id="${c.id}">Quitar reserva</button>`}`}
        <button class="btn sm line" data-a="edit" data-id="${c.id}">Editar</button>
        ${confirmDel===c.id?`<button class="btn danger sm" data-a="del-ok" data-id="${c.id}">Confirmar eliminar</button>`:`<button class="btn danger sm" data-a="del" data-id="${c.id}">Eliminar</button>`}
      </div></div>`).join(''):'<div class="empty">Aún no hay coches. Pulsa Añadir coche.</div>'}</div></div>`;
    $('#cerrar',a).onclick=()=>{confirmDel=null;a.close()};
    $('#nuevo',a).onclick=()=>{editing='new';draft={id:'c'+Date.now(),ref:nextRef(),marca:'',modelo:'',anio:new Date().getFullYear(),km:0,precio:0,combustible:'Gasolina',cambio:'Manual',cv:0,color:'',carroceria:'Turismo',puertas:5,plazas:5,etiqueta:'',equipamiento:'',estado:'venta',destacado:false,desc:'',fotos:[]};panel()};
    const lf=$('#logof',a);$('#logo',a).onclick=()=>lf.click();
    lf.onchange=async()=>{if(lf.files[0]){state.logo=await reducir(lf.files[0],1000,'image/png');cambio();panel()}};
    a.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const c=state.cars.find(x=>x.id===b.dataset.id);const k=b.dataset.a;
      if(k==='edit'){editing=c.id;draft=JSON.parse(JSON.stringify(c));panel();return}
      if(k==='del'){confirmDel=c.id;panel();return}
      if(k==='del-ok'){state.cars=state.cars.filter(x=>x.id!==c.id);confirmDel=null;cambio();panel();return}
      c.estado=k;cambio();panel();
    });
  }
  if(!a.open)a.showModal();
}
function formulario(a){
  const d=draft;
  const sel=(id,opts,val)=>`<select id="${id}">${opts.map(v=>`<option ${val===v?'selected':''}>${v}</option>`).join('')}</select>`;
  a.innerHTML=`<div class="admin"><h2>${editing==='new'?'Añadir coche':'Editar coche'}</h2>
  <div class="form">
   <label>Referencia<input id="f-ref" value="${esc(d.ref)}"></label>
   <label>Estado<select id="f-estado">${[['venta','Disponible'],['reservado','Reservado'],['vendido','Vendido']].map(([v,t])=>`<option value="${v}" ${d.estado===v?'selected':''}>${t}</option>`).join('')}</select></label>
   <label>Marca<input id="f-marca" value="${esc(d.marca)}" placeholder="Volkswagen"></label>
   <label>Modelo y versión<input id="f-modelo" value="${esc(d.modelo)}" placeholder="Golf 1.5 TSI"></label>
   <label>Año<input id="f-anio" type="number" value="${d.anio}"></label>
   <label>Kilómetros<input id="f-km" type="number" value="${d.km}"></label>
   <label>Precio (€, 0 = consultar)<input id="f-precio" type="number" value="${d.precio}"></label>
   <label>Potencia (CV)<input id="f-cv" type="number" value="${d.cv||0}"></label>
   <label>Combustible${sel('f-comb',['Gasolina','Diésel','Híbrido','Eléctrico','GLP'],d.combustible)}</label>
   <label>Cambio${sel('f-cambio',['Manual','Automático'],d.cambio)}</label>
   <label>Color<input id="f-color" value="${esc(d.color||'')}"></label>
   <label>Carrocería${sel('f-carr',['Turismo','SUV','Monovolumen','Furgoneta','Cabrio','Coupé','Pick-up','Otro'],d.carroceria||'Turismo')}</label>
   <label>Puertas<input id="f-puertas" type="number" value="${d.puertas||0}"></label>
   <label>Plazas<input id="f-plazas" type="number" value="${d.plazas||0}"></label>
   <label>Etiqueta DGT${sel('f-etq',['','0','ECO','C','B','Sin etiqueta'],d.etiqueta||'')}</label>
   <label class="full">Equipamiento (separado por comas)<textarea id="f-eq">${esc(d.equipamiento||'')}</textarea></label>
   <label class="full">Descripción<textarea id="f-desc">${esc(d.desc)}</textarea></label>
   <label class="full ck"><input id="f-dest" type="checkbox" ${d.destacado?'checked':''}> Destacar en la portada</label>
   <div class="full"><div class="note" style="margin-bottom:8px;font-weight:700">Fotos (la primera es la portada)</div>
    <div class="photos">${d.fotos.map((f,i)=>`<div class="p"><img src="${f}" alt=""><button data-rm="${i}" aria-label="Quitar foto">×</button></div>`).join('')}</div>
    <p style="margin:10px 0 0"><input id="f-fotos" type="file" accept="image/*" multiple></p></div>
  </div>
  <p class="note dirty" id="err"></p>
  <div class="acts" style="justify-content:flex-end"><button class="btn sm line" id="cancel">Cancelar</button><button class="btn sm" id="save">Guardar coche</button></div></div>`;
  const leer=()=>{d.ref=$('#f-ref',a).value.trim();d.marca=$('#f-marca',a).value.trim();d.modelo=$('#f-modelo',a).value.trim();d.anio=+$('#f-anio',a).value;d.km=+$('#f-km',a).value;d.precio=+$('#f-precio',a).value;d.cv=+$('#f-cv',a).value;d.estado=$('#f-estado',a).value;d.combustible=$('#f-comb',a).value;d.cambio=$('#f-cambio',a).value;d.color=$('#f-color',a).value.trim();d.carroceria=$('#f-carr',a).value;d.puertas=+$('#f-puertas',a).value;d.plazas=+$('#f-plazas',a).value;d.etiqueta=$('#f-etq',a).value;d.equipamiento=$('#f-eq',a).value.trim();d.desc=$('#f-desc',a).value.trim();d.destacado=$('#f-dest',a).checked};
  a.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{leer();d.fotos.splice(+b.dataset.rm,1);panel()});
  $('#f-fotos',a).onchange=async e=>{leer();for(const f of e.target.files){d.fotos.push(await reducir(f,1000,'image/jpeg'))}panel()};
  $('#cancel',a).onclick=()=>{editing=null;draft=null;panel()};
  $('#save',a).onclick=()=>{leer();if(!d.marca||!d.modelo){$('#err',a).textContent='Escribe la marca y el modelo.';return}
    if(d.destacado)state.cars.forEach(c=>c.destacado=false);
    if(editing==='new')state.cars.push(d);else state.cars=state.cars.map(c=>c.id===d.id?d:c);
    editing=null;draft=null;cambio();panel()};
}
function reducir(file,max,tipo){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(tipo,.82))};im.src=r.result};r.readAsDataURL(file)})}
function cambio(){dirty=true;renderSite();renderBar()}
function renderBar(){
  const b=$('#adminbar');if(!isAdmin){b.innerHTML='';return}
  b.innerHTML=`<div class="admin-bar">${dirty?'<button class="btn" id="pub">Publicar cambios</button>':''}<button class="btn ${dirty?'line':''}" id="gest">Gestionar coches</button></div>`;
  $('#gest').onclick=()=>panel();const p=$('#pub');if(p)p.onclick=publicar;
}
async function publicar(){
  const btn=$('#pub');if(btn){btn.disabled=true;btn.textContent='Publicando…'}
  try{
    $('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    const clone=document.body.cloneNode(true);
    [...clone.children].forEach(n=>{const t=n.tagName;if(['TITLE','META','STYLE','LINK'].includes(t)||n.hasAttribute('data-keep'))return;n.remove()});
    clone.querySelector('#app').innerHTML='';
    const reset=document.head.querySelector('style')?.textContent||'';
    const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+clone.innerHTML+'</body></html>';
    await art.publish(html);
    dirty=false;
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Publicar cambios'}
    if(!(e&&e.code==='conflict')){const b=$('.admin-bar');if(b){const m=document.createElement('p');m.className='note dirty';m.style.cssText='background:var(--bg);padding:8px;border:1px solid var(--line);margin:0';m.textContent='No se pudo publicar ('+((e&&e.code)||'error')+'). Inténtalo de nuevo.';b.prepend(m)}}
  }
}
$('#app').innerHTML='<div id="site"></div><div id="adminbar"></div><dialog id="dlg"></dialog><dialog id="adm"></dialog>';
['dlg','adm'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id)e.target.close()}));
renderSite();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const u=await claude.use('user');art=await claude.use('artifact');
    if(art&&u&&await u.canEdit()){isAdmin=true;renderBar()}
  }catch(e){}
})();
})();
</script>

</body></html>
